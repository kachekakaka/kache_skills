interface:
  display_name: "项目文档骨架检查与方案"
  short_description: "只读完整检查项目文档结构，按请求报告或保存可实施方案"
  default_prompt: "使用 $project-doc-skeleton 检查当前项目文档骨架；先判断只报告还是形成方案，意图不清时只报告，只有方案路线才一次询问自查轮数与实施后是否生成反哺报告并推荐‘两轮、不生成’；按有界当前资产、生命周期与身份关系完成只读检查，普通语义确认不触发写入或状态转换，最终保存后停止。"

policy:
  allow_implicit_invocation: false
