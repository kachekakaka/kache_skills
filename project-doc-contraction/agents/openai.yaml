interface:
  display_name: "项目文档内容收缩审计与方案"
  short_description: "基于已验证一致性提交，只读查找重复、镜像、过程、错位和复杂内容"
  default_prompt: "使用 $project-doc-contraction 只做项目文档内容收缩；若我未给 SHA，先用只读 Git 把当前 HEAD 作为已经完成一致性整改与验证的基线提交候选，默认 full + 只读报告，只问一句我是否确认该提交已完成一致性整改且做过一致性验证。回复“确认”即可，不索要验证证据；明确要求方案时默认两轮、不生成反哺，方案只在最终确认时保存并随后停止。"

policy:
  allow_implicit_invocation: false
