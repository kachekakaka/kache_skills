          from pathlib import Path
          from textwrap import dedent

          ROOT = Path.cwd()


          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")


          def write(path: str, text: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8", newline="\n")


          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:80]!r}")
              write(path, text.replace(old, new, 1))


          def insert_before(path: str, marker: str, addition: str) -> None:
              text = read(path)
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, got {count}: {marker!r}")
              write(path, text.replace(marker, addition + marker, 1))


          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              text = read(path)
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{path}: missing start marker: {start!r}")
              body_start = start_index + len(start)
              end_index = text.find(end, body_start)
              if end_index < 0:
                  raise SystemExit(f"{path}: missing end marker: {end!r}")
              write(path, text[:body_start] + replacement + text[end_index:])


