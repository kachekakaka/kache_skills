name: 临时验证并发布一致性 Skill 最终补强

on:
  push:
    branches:
      - agent/final-consistency-hardening-20260816

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify immutable base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9f0510ee92ea958d2a1a4988bb4ca957fad53a70"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "9f0510ee92ea958d2a1a4988bb4ca957fad53a70"

      - name: Apply narrow consistency hardening
        shell: bash
        run: |
          python - <<'PY'
          COUNTER_REF = '# 一致性反证与跨载体扫描参考\n\n本文只扩展 `project-doc-consistency` 的 `full` 审计方法，用来主动寻找“初审看起来一致”背后的跨载体矛盾。\n它不建立新的业务权威，不做内容收缩，也不要求全仓两两比较。\n\n## 使用条件\n\n- `full` 审计必须完整读取本文，并在普通自然契约单元审计后完成四类扫描。\n- `incremental` 只有在内容种子涉及时间状态、允许／禁止合同、聚合入口或操作粒度时读取相应小节。\n- 扫描只沿已冻结文档和一轮直接证据工作；发现新的活动文档范围问题时按主 Skill 记录 `未覆盖`，不得静默扩张。\n\n## 四类跨载体扫描\n\n### 1. 初始状态与运行时转换\n\n检查“启动时、初始、当前、阶段性、永久、仅在某阶段”等限定，是否与状态机、切换 API、代际、租约、恢复路径或\n直接消费者的运行期转换相冲突。至少记录初始态、允许转换、失败态、终态和是否持久化。\n\n### 2. 允许、禁止、退役合同与夹具\n\n当当前权威已经禁止、退役或收窄依赖、字段、路径、身份或状态时，检查正向／允许夹具是否仍把它作为合法输入；同时检查\n负向夹具是否仍拒绝当前已经允许的行为。测试和实现共同接受旧行为时，不能以“测试通过”证明一致。\n\n### 3. 聚合入口与成员闭包\n\n对 `all`、`run-all`、suite、manifest、expected、Registry 汇总或“顺序跑以上”等声明，分别列出文档宣称的成员和\n实际调度／选择成员，比较遗漏、多余、顺序或条件差异。数量相同不能代替成员闭包。\n\n### 4. 身份与操作粒度\n\n“同一 source／lease／snapshot”不自动等于“同一请求／响应／调用”。检查普通操作与独立精确操作、可选字段与显式\n查询、共享身份与独立生命周期是否被文档错误合并。必须点名实际调用边界和直接消费者。\n\n## 正式证据\n\n每类扫描都在一个或多个正式 `Axxx` 中记录：\n\n1. 被挑战的具体声明和路径锚点；\n2. 当前权威与初审正向证据；\n3. 不同角色的相反证据或邻接消费者；\n4. 结论、发现或明确残余。\n\n没有适用候选时，也要写明检查过的限定词／聚合入口／夹具／操作边界和“不适用”的具体理由；“已搜索、未发现问题”\n或文件数量对账不能算完成。\n\n## 第一轮反证式查漏\n\n进入第一轮时，对每份文档级 `一致` 结论独立记录：\n\n- 可证伪主张；\n- 初审正向证据；\n- 与正向证据不同角色的相反证据或邻接消费者；\n- `改变`／`未改变`；\n- 反证为何推翻或未推翻原结论。\n\n只有主张、证据角色和结论完全相同，才可显式分组；即使分组，每条路径仍要独立命名并给出锚点。\n`N/N 不变`、`同前`、`原证据仍成立` 或按职责类别列名单都不能替代上述记录。\n\n## 第二轮防语义误改\n\n每项拟议修正必须分别回答：产品语义、权限／安全边界、测试选择／分类／覆盖义务、运行行为、历史决定和一层直接消费者\n是否改变，并给出 `通过`、`修改` 或 `撤销`。一段综合说明不能代替逐轴结论。\n\n## 失败关闭\n\n任一四类扫描缺少正式记录、第一轮缺少不同角色反证、第二轮缺少逐轴结论，或正式记录在保存前已无法从当前线程或经\n用户授权的仓库外轨迹中取得时，完整性门失败；只能报告 `未覆盖`，不得询问保存完整方案。\n'
          INSTALLER_SCRIPT = '#!/usr/bin/env python3\n"""精确镜像安装项目文档 Skill，并生成可验证来源清单。"""\n\nfrom __future__ import annotations\n\nimport argparse\nimport hashlib\nimport json\nimport shutil\nimport subprocess\nimport sys\nfrom datetime import datetime, timezone\nfrom pathlib import Path\nfrom typing import Iterable\n\n\nREPO_ROOT = Path(__file__).resolve().parents[2]\nPROVENANCE_NAME = "SOURCE-PROVENANCE.json"\nCALLABLE_DEPENDENCIES = {\n    "project-doc-consistency": ("project-doc-consistency", "project-doc-shared"),\n    "project-doc-contraction": ("project-doc-contraction", "project-doc-shared"),\n    "project-doc-skeleton": ("project-doc-skeleton",),\n}\n\n\ndef sha256_file(path: Path) -> str:\n    digest = hashlib.sha256()\n    with path.open("rb") as stream:\n        for block in iter(lambda: stream.read(1024 * 1024), b""):\n            digest.update(block)\n    return digest.hexdigest()\n\n\ndef iter_files(root: Path, roots: Iterable[str]) -> dict[str, str]:\n    result: dict[str, str] = {}\n    for root_name in roots:\n        base = root / root_name\n        if not base.is_dir():\n            raise FileNotFoundError(f"缺少目录: {base}")\n        for path in sorted(base.rglob("*")):\n            if not path.is_file() or path.name == PROVENANCE_NAME:\n                continue\n            relative = path.relative_to(root).as_posix()\n            result[relative] = sha256_file(path)\n    return result\n\n\ndef mirror_directory(source: Path, target: Path) -> None:\n    if target.exists():\n        if not target.is_dir():\n            raise RuntimeError(f"安装目标不是目录: {target}")\n        shutil.rmtree(target)\n    shutil.copytree(source, target)\n\n\ndef git_output(source_root: Path, *args: str) -> str:\n    result = subprocess.run(\n        ("git", "-C", str(source_root), *args),\n        check=False,\n        capture_output=True,\n        text=True,\n        encoding="utf-8",\n        errors="replace",\n    )\n    if result.returncode != 0:\n        raise RuntimeError(\n            f"Git 命令失败: git {\' \'.join(args)}\\n{result.stdout}{result.stderr}"\n        )\n    return result.stdout.strip()\n\n\ndef git_metadata(source_root: Path) -> dict[str, str]:\n    status = git_output(source_root, "status", "--porcelain")\n    if status:\n        raise RuntimeError("源仓库工作树或索引不干净，拒绝生成可追溯安装")\n    branch = git_output(source_root, "branch", "--show-current")\n    if not branch:\n        raise RuntimeError("源仓库处于 detached HEAD，拒绝安装")\n    return {\n        "source_repository": git_output(source_root, "remote", "get-url", "origin"),\n        "source_branch": branch,\n        "source_commit": git_output(source_root, "rev-parse", "HEAD"),\n    }\n\n\ndef build_manifest(\n    target_root: Path,\n    skill_name: str,\n    metadata: dict[str, str],\n) -> dict[str, object]:\n    roots = CALLABLE_DEPENDENCIES[skill_name]\n    return {\n        "schema_version": 1,\n        "skill_name": skill_name,\n        **metadata,\n        "installed_at_utc": datetime.now(timezone.utc).isoformat(),\n        "roots": list(roots),\n        "files": iter_files(target_root, roots),\n    }\n\n\ndef write_manifest(\n    target_root: Path,\n    skill_name: str,\n    metadata: dict[str, str],\n) -> Path:\n    manifest_path = target_root / skill_name / PROVENANCE_NAME\n    manifest = build_manifest(target_root, skill_name, metadata)\n    manifest_path.write_text(\n        json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\\n",\n        encoding="utf-8",\n        newline="\\n",\n    )\n    return manifest_path\n\n\ndef verify_manifest(target_root: Path, skill_name: str) -> dict[str, object]:\n    manifest_path = target_root / skill_name / PROVENANCE_NAME\n    if not manifest_path.is_file():\n        return {"state": "missing", "skill_name": skill_name, "issues": ["缺少来源清单"]}\n    try:\n        manifest = json.loads(manifest_path.read_text(encoding="utf-8"))\n    except (OSError, json.JSONDecodeError) as exc:\n        return {\n            "state": "mismatch",\n            "skill_name": skill_name,\n            "issues": [f"来源清单不可读: {exc}"],\n        }\n\n    issues: list[str] = []\n    if manifest.get("schema_version") != 1:\n        issues.append("schema_version 必须为 1")\n    if manifest.get("skill_name") != skill_name:\n        issues.append("skill_name 不匹配")\n    roots = manifest.get("roots")\n    files = manifest.get("files")\n    if not isinstance(roots, list) or not all(isinstance(item, str) for item in roots):\n        issues.append("roots 必须是字符串列表")\n        roots = []\n    if not isinstance(files, dict) or not all(\n        isinstance(path, str) and isinstance(value, str)\n        for path, value in (files.items() if isinstance(files, dict) else ())\n    ):\n        issues.append("files 必须是路径到 SHA-256 的映射")\n        files = {}\n\n    actual: dict[str, str] = {}\n    if roots:\n        try:\n            actual = iter_files(target_root, roots)\n        except (OSError, RuntimeError) as exc:\n            issues.append(str(exc))\n\n    expected_paths = set(files)\n    actual_paths = set(actual)\n    for missing in sorted(expected_paths - actual_paths):\n        issues.append(f"缺少安装文件: {missing}")\n    for extra in sorted(actual_paths - expected_paths):\n        issues.append(f"存在清单外文件: {extra}")\n    for path in sorted(expected_paths & actual_paths):\n        if files[path] != actual[path]:\n            issues.append(f"SHA-256 不匹配: {path}")\n\n    required_metadata = ("source_repository", "source_branch", "source_commit")\n    for field in required_metadata:\n        value = manifest.get(field)\n        if not isinstance(value, str) or not value.strip():\n            issues.append(f"缺少来源字段: {field}")\n\n    return {\n        "state": "verified" if not issues else "mismatch",\n        "skill_name": skill_name,\n        "source_repository": manifest.get("source_repository"),\n        "source_branch": manifest.get("source_branch"),\n        "source_commit": manifest.get("source_commit"),\n        "file_count": len(files),\n        "issues": issues,\n    }\n\n\ndef install(\n    source_root: Path,\n    target_root: Path,\n    skills: Iterable[str],\n    metadata: dict[str, str],\n) -> list[dict[str, object]]:\n    selected = tuple(dict.fromkeys(skills))\n    unknown = [name for name in selected if name not in CALLABLE_DEPENDENCIES]\n    if unknown:\n        raise ValueError(f"未知 Skill: {\', \'.join(unknown)}")\n\n    roots: list[str] = []\n    for skill_name in selected:\n        for root_name in CALLABLE_DEPENDENCIES[skill_name]:\n            if root_name not in roots:\n                roots.append(root_name)\n\n    target_root.mkdir(parents=True, exist_ok=True)\n    for root_name in roots:\n        mirror_directory(source_root / root_name, target_root / root_name)\n\n    for skill_name in selected:\n        write_manifest(target_root, skill_name, metadata)\n\n    results = [verify_manifest(target_root, name) for name in selected]\n    failed = [item for item in results if item["state"] != "verified"]\n    if failed:\n        raise RuntimeError(json.dumps(failed, ensure_ascii=False, indent=2))\n    return results\n\n\ndef parse_args() -> argparse.Namespace:\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument("--source-root", type=Path, default=REPO_ROOT)\n    parser.add_argument(\n        "--target-root",\n        type=Path,\n        default=Path.home() / ".codex" / "skills",\n    )\n    parser.add_argument(\n        "--skills",\n        nargs="+",\n        choices=sorted(CALLABLE_DEPENDENCIES),\n        default=sorted(CALLABLE_DEPENDENCIES),\n    )\n    parser.add_argument("--apply", action="store_true")\n    parser.add_argument("--verify-only", action="store_true")\n    return parser.parse_args()\n\n\ndef main() -> int:\n    args = parse_args()\n    source_root = args.source_root.resolve()\n    target_root = args.target_root.resolve()\n\n    if args.verify_only:\n        results = [verify_manifest(target_root, name) for name in args.skills]\n        print(json.dumps(results, ensure_ascii=False, indent=2))\n        return 0 if all(item["state"] == "verified" for item in results) else 1\n\n    if not args.apply:\n        print("未指定 --apply；未修改安装目录。", file=sys.stderr)\n        return 2\n\n    metadata = git_metadata(source_root)\n    results = install(source_root, target_root, args.skills, metadata)\n    print(json.dumps(results, ensure_ascii=False, indent=2))\n    return 0\n\n\nif __name__ == "__main__":\n    raise SystemExit(main())\n'
          INSTALLER_TEST = '#!/usr/bin/env python3\n"""验证项目文档 Skill 精确镜像安装和来源清单。"""\n\nfrom __future__ import annotations\n\nimport importlib.util\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[2]\nINSTALLER_PATH = ROOT / "SoftwareTesting/doc_consistency/install_project_doc_skills.py"\n\nSPEC = importlib.util.spec_from_file_location("project_doc_skill_installer", INSTALLER_PATH)\nif SPEC is None or SPEC.loader is None:\n    raise RuntimeError(f"无法加载安装器: {INSTALLER_PATH}")\nINSTALLER = importlib.util.module_from_spec(SPEC)\nSPEC.loader.exec_module(INSTALLER)\n\n\nclass ProjectDocSkillInstallerTest(unittest.TestCase):\n    def test_exact_mirror_and_provenance_verification(self) -> None:\n        with tempfile.TemporaryDirectory() as temporary:\n            root = Path(temporary)\n            source = root / "source"\n            target = root / "target"\n            (source / "project-doc-consistency/references").mkdir(parents=True)\n            (source / "project-doc-shared/references").mkdir(parents=True)\n            (source / "project-doc-consistency/SKILL.md").write_text(\n                "skill\\n", encoding="utf-8", newline="\\n"\n            )\n            (source / "project-doc-consistency/references/example.md").write_text(\n                "reference\\n", encoding="utf-8", newline="\\n"\n            )\n            (source / "project-doc-shared/references/shared.md").write_text(\n                "shared\\n", encoding="utf-8", newline="\\n"\n            )\n            (target / "project-doc-consistency").mkdir(parents=True)\n            (target / "project-doc-consistency/stale.txt").write_text(\n                "stale\\n", encoding="utf-8"\n            )\n\n            metadata = {\n                "source_repository": "https://example.invalid/repo.git",\n                "source_branch": "main",\n                "source_commit": "a" * 40,\n            }\n            results = INSTALLER.install(\n                source,\n                target,\n                ("project-doc-consistency",),\n                metadata,\n            )\n\n            self.assertEqual("verified", results[0]["state"])\n            self.assertFalse(\n                (target / "project-doc-consistency/stale.txt").exists()\n            )\n            manifest = target / "project-doc-consistency/SOURCE-PROVENANCE.json"\n            self.assertTrue(manifest.is_file())\n\n            verified = INSTALLER.verify_manifest(\n                target, "project-doc-consistency"\n            )\n            self.assertEqual("verified", verified["state"], verified)\n\n    def test_modified_installed_file_is_mismatch(self) -> None:\n        with tempfile.TemporaryDirectory() as temporary:\n            root = Path(temporary)\n            source = root / "source"\n            target = root / "target"\n            (source / "project-doc-consistency").mkdir(parents=True)\n            (source / "project-doc-shared/references").mkdir(parents=True)\n            (source / "project-doc-consistency/SKILL.md").write_text(\n                "skill\\n", encoding="utf-8", newline="\\n"\n            )\n            (source / "project-doc-shared/references/shared.md").write_text(\n                "shared\\n", encoding="utf-8", newline="\\n"\n            )\n            INSTALLER.install(\n                source,\n                target,\n                ("project-doc-consistency",),\n                {\n                    "source_repository": "repo",\n                    "source_branch": "main",\n                    "source_commit": "b" * 40,\n                },\n            )\n            (target / "project-doc-shared/references/shared.md").write_text(\n                "changed\\n", encoding="utf-8", newline="\\n"\n            )\n\n            result = INSTALLER.verify_manifest(\n                target, "project-doc-consistency"\n            )\n            self.assertEqual("mismatch", result["state"])\n            self.assertTrue(\n                any("SHA-256 不匹配" in issue for issue in result["issues"]),\n                result,\n            )\n\n    def test_missing_manifest_is_reported(self) -> None:\n        with tempfile.TemporaryDirectory() as temporary:\n            result = INSTALLER.verify_manifest(\n                Path(temporary), "project-doc-consistency"\n            )\n            self.assertEqual("missing", result["state"])\n\n\nif __name__ == "__main__":\n    unittest.main()\n'
          COUNTER_TEST = '#!/usr/bin/env python3\n"""机械检查一致性反证扫描、评审证据和来源身份合同。"""\n\nfrom __future__ import annotations\n\nimport unittest\nfrom pathlib import Path\nfrom typing import Iterable\n\n\nROOT = Path(__file__).resolve().parents[2]\nSKILL_PATH = Path("project-doc-consistency/SKILL.md")\nREFERENCE_PATH = Path(\n    "project-doc-consistency/references/counterevidence-audit.md"\n)\nSHARED_PATH = Path("project-doc-shared/references/long-audit-protocol.md")\nAGENT_PATH = Path("project-doc-consistency/agents/openai.yaml")\n\nR1_REQUIRED_FIELDS = (\n    "path",\n    "claim",\n    "initial_evidence",\n    "counter_evidence",\n    "result",\n    "reason",\n)\nR2_REQUIRED_FIELDS = (\n    "action",\n    "product_semantics",\n    "permission_or_security",\n    "test_selection",\n    "runtime_behavior",\n    "historical_decision",\n    "direct_consumer",\n    "result",\n)\n\n\ndef read_text(relative: Path) -> str:\n    path = ROOT / relative\n    if not path.is_file():\n        raise AssertionError(f"缺少文件: {relative.as_posix()}")\n    return path.read_text(encoding="utf-8")\n\n\ndef compact(text: str) -> str:\n    return "".join(text.split())\n\n\ndef validate_r1(\n    expected_paths: Iterable[str],\n    records: list[dict[str, str]],\n) -> list[str]:\n    issues: list[str] = []\n    expected = tuple(expected_paths)\n    actual = tuple(record.get("path", "") for record in records)\n    if set(actual) != set(expected) or len(actual) != len(expected):\n        issues.append("第一轮没有逐份覆盖固定文档集合")\n    for record in records:\n        path = record.get("path", "<unknown>")\n        for field in R1_REQUIRED_FIELDS:\n            if not record.get(field, "").strip():\n                issues.append(f"{path}: 缺少 R001 字段 {field}")\n        if record.get("initial_evidence") == record.get("counter_evidence"):\n            issues.append(f"{path}: 相反证据不得复用初审正向证据")\n        if record.get("result") not in {"改变", "未改变"}:\n            issues.append(f"{path}: result 必须是改变或未改变")\n    return issues\n\n\ndef validate_r2(\n    expected_actions: Iterable[str],\n    records: list[dict[str, str]],\n) -> list[str]:\n    issues: list[str] = []\n    expected = tuple(expected_actions)\n    actual = tuple(record.get("action", "") for record in records)\n    if set(actual) != set(expected) or len(actual) != len(expected):\n        issues.append("第二轮没有逐项覆盖固定动作集合")\n    for record in records:\n        action = record.get("action", "<unknown>")\n        for field in R2_REQUIRED_FIELDS:\n            if not record.get(field, "").strip():\n                issues.append(f"{action}: 缺少 R002 字段 {field}")\n        if record.get("result") not in {"通过", "修改", "撤销"}:\n            issues.append(f"{action}: result 必须是通过、修改或撤销")\n    return issues\n\n\nclass ProjectDocConsistencyCounterevidenceTest(unittest.TestCase):\n    def test_repository_contracts_pass(self) -> None:\n        skill = compact(read_text(SKILL_PATH))\n        reference = compact(read_text(REFERENCE_PATH))\n        shared = compact(read_text(SHARED_PATH))\n        agent = compact(read_text(AGENT_PATH))\n\n        required_skill = (\n            "SOURCE-PROVENANCE.json",\n            "verified",\n            "missing",\n            "mismatch",\n            "references/counterevidence-audit.md",\n            "四类跨载体扫描",\n            "可证伪主张",\n            "初审正向证据",\n            "不同角色的相反证据或邻接消费者",\n            "仓库外正式轨迹",\n            "不得询问保存",\n        )\n        required_reference = (\n            "初始状态与运行时转换",\n            "允许、禁止、退役合同与夹具",\n            "聚合入口与成员闭包",\n            "身份与操作粒度",\n            "数量相同不能代替成员闭包",\n            "同一source／lease／snapshot",\n            "N/N不变",\n            "失败关闭",\n        )\n        required_shared = (\n            "用户明确授权",\n            "仓库外正式轨迹",\n            "逐字追加",\n            "不得事后补造",\n        )\n        required_agent = (\n            "四类跨载体反证扫描",\n            "逐文档反证式Rxxx",\n            "SOURCE-PROVENANCE.json",\n        )\n        for token in required_skill:\n            self.assertIn(compact(token), skill, token)\n        for token in required_reference:\n            self.assertIn(compact(token), reference, token)\n        for token in required_shared:\n            self.assertIn(compact(token), shared, token)\n        for token in required_agent:\n            self.assertIn(compact(token), agent, token)\n\n    def test_grouped_or_self_confirming_r1_is_rejected(self) -> None:\n        issues = validate_r1(\n            ("S001", "S002"),\n            [\n                {\n                    "path": "S001-S002",\n                    "claim": "全部一致",\n                    "initial_evidence": "README",\n                    "counter_evidence": "README",\n                    "result": "未改变",\n                    "reason": "2/2 不变",\n                }\n            ],\n        )\n        self.assertTrue(\n            any("逐份覆盖" in issue for issue in issues),\n            issues,\n        )\n        self.assertTrue(\n            any("不得复用" in issue for issue in issues),\n            issues,\n        )\n\n    def test_per_document_adversarial_r1_is_accepted(self) -> None:\n        issues = validate_r1(\n            ("S001", "S002"),\n            [\n                {\n                    "path": "S001",\n                    "claim": "启动时选择后运行期不可切换",\n                    "initial_evidence": "需求表",\n                    "counter_evidence": "运行时切换 API",\n                    "result": "改变",\n                    "reason": "直接消费者允许双向热切换",\n                },\n                {\n                    "path": "S002",\n                    "claim": "run-all 调度全部声明成员",\n                    "initial_evidence": "命令表",\n                    "counter_evidence": "实际调度函数",\n                    "result": "未改变",\n                    "reason": "声明成员与实际调用闭包一致",\n                },\n            ],\n        )\n        self.assertEqual([], issues)\n\n    def test_r2_requires_each_safety_axis(self) -> None:\n        issues = validate_r2(\n            ("F001",),\n          