interface:
  display_name: "项目文档一致性检查与方案"
  short_description: "核对活动文档事实并保存可独立实施与关闭的方案"
  default_prompt: "使用 $project-doc-consistency 检查活动文档与当前事实；先用白话询问‘交付方案前需要我自查几遍’并接受‘按推荐’为两遍，只读审计并评审候选；权威已定的冲突作为修复项，Registry 或旧测试不升格为业务契约权威，职责已定时只修分类与触发，真正需要拍板时让卡片正文避开字段、路径和工具术语并提供‘按推荐’，最后询问是否‘只保存方案，不开始实施’并停止。"

policy:
  allow_implicit_invocation: false
